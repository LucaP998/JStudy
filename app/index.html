<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)">
<title>JStudy</title>
<link rel="icon" href="/static/icon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/icon-180.png?v=2">
<link rel="manifest" href="/static/manifest.webmanifest?v=3">
<meta name="apple-mobile-web-app-title" content="JStudy">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root {
  --bg: #f6f5f1; --card: #fff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e1da;
  --accent: #2f5bd3; --ok: #1f8a4c; --ok-bg: #e3f4ea; --bad: #c4352b; --bad-bg: #fbe6e4;
  --warn-bg: #fff4d6; --chip: #ecebe6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161b; --card: #1e2128; --ink: #ececef; --muted: #9a9aa3; --line: #2e323b;
    --accent: #7c9cff; --ok: #5fd08f; --ok-bg: #1c3427; --bad: #ff7b70; --bad-bg: #3d2120;
    --warn-bg: #3a3220; --chip: #2a2e37; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  -webkit-tap-highlight-color: transparent; }
header { position: relative; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: max(8px, env(safe-area-inset-top)) 12px 8px; }
.bar { display: flex; align-items: center; gap: 8px; max-width: 760px; margin: 0 auto; }
.bar h1 { font-size: 17px; margin: 0; flex: 1; }
.small { border: 0; background: var(--chip); color: var(--ink); border-radius: 999px;
  padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
.small.on { background: var(--accent); color: #fff; }
/* ☰ page menu (Study / Profile / Settings) */
.navbtn { display: grid; place-items: center; width: 38px; height: 34px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--ink); cursor: pointer; padding: 0; }
.navbtn[aria-expanded="true"] { background: var(--chip); }
.lvmenu.navmenu { left: auto; right: 0; min-width: 270px; }
.navmenu button { align-items: center; }
.navmenu button.on { box-shadow: inset 3px 0 0 var(--accent); }
.navmenu span { line-height: 1.35; font-size: 13px; }
.pagetitle { font-size: 20px; margin: 2px 2px 12px; }
/* section chips: outlined filters under Study */
.chips button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px;
  padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
.chips button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent);
  color: var(--accent); font-weight: 600; }
.studybar { display: flex; gap: 8px; align-items: center; max-width: 760px; margin: 8px auto 0; }
.chips { display: grid; gap: 6px; flex: 1; min-width: 0;
  scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips .n { opacity: .75; font-size: 12px; margin-left: 3px; }
main { max-width: 760px; margin: 0 auto; padding: 14px 12px 120px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.tag { background: var(--chip); border-radius: 6px; padding: 1px 7px; }
.tag.review { background: var(--warn-bg); color: var(--ink); }
.passage { white-space: pre-wrap; font-size: 17px; line-height: 2; border-left: 3px solid var(--line);
  padding: 2px 0 2px 12px; margin-bottom: 14px; }
.question { font-size: 19px; line-height: 2.1; margin: 4px 0 14px; white-space: pre-wrap; }
.u { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px; }
ruby rt { font-size: 0.55em; color: var(--accent); visibility: hidden; }
ruby.show rt { visibility: visible; }
body.furi-tap ruby { cursor: pointer; border-bottom: 1px dotted color-mix(in srgb, var(--muted) 50%, transparent); }
body.furi-off rt { display: none; }
body.furi-on rt { visibility: visible; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; padding: 12px 14px;
  border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px;
  font: inherit; font-size: 18px; line-height: 1.9; cursor: pointer; }
.opt .num { flex: none; width: 26px; height: 26px; margin-top: 5px; border-radius: 50%; background: var(--chip);
  display: grid; place-items: center; font-size: 14px; font-weight: 600; }
.opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.unsure { border: 1.5px dashed var(--line); background: none; color: var(--muted); border-radius: 999px;
  padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.unsure.on { border-style: solid; border-color: #d9a200; color: var(--ink); background: var(--warn-bg); }
.result { margin-top: 14px; padding: 12px 14px; border-radius: 12px; line-height: 1.9; }
.result.ok { background: var(--ok-bg); } .result.bad { background: var(--bad-bg); }
.result b { display: block; margin-bottom: 4px; }
.next:disabled { opacity: .45; cursor: default; }
.next { margin-left: auto; border: 0; background: var(--accent); color: #fff; border-radius: 12px;
  padding: 12px 22px; font: inherit; font-weight: 600; font-size: 17px; cursor: pointer; }
#pre .dropBtn { margin-left: auto; }
.link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; padding: 4px; }
.player { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.play { border: 0; background: var(--accent); color: #fff; border-radius: 12px; padding: 12px 18px; font: inherit;
  font-size: 17px; font-weight: 600; cursor: pointer; min-width: 120px; }
.speed button { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 5px 9px;
  font: inherit; font-size: 13px; cursor: pointer; }
.speed button:first-child { border-radius: 8px 0 0 8px; } .speed button:last-child { border-radius: 0 8px 8px 0; }
.speed button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.prog { height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; margin-bottom: 12px; }
.prog i { display: block; height: 100%; background: var(--accent); }
/* Ask Claude (after answering) */
.askbtn { width: 100%; margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 12px;
  background: none; color: var(--accent); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
.askbtn[aria-expanded="true"] { border-style: solid; }
.ask { display: grid; gap: 10px; margin-top: 10px; }
.ask .log { display: grid; gap: 10px; }
.msg { border-radius: 14px; padding: 9px 13px; font-size: 15px; line-height: 1.75; overflow-wrap: anywhere; }
.msg.me { justify-self: end; max-width: 88%; background: var(--accent); color: #fff; white-space: pre-wrap;
  border-bottom-right-radius: 4px; }
.msg.ai { justify-self: start; max-width: 100%; background: var(--chip); border-bottom-left-radius: 4px; }
.msg.ai p { margin: 0 0 8px; } .msg.ai p:last-child { margin: 0; }
.msg.ai ul { margin: 0 0 8px; padding-left: 20px; }
.msg.err { background: var(--bad-bg); }
.thinking { color: var(--muted); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.askform { display: grid; gap: 8px; }
.askform textarea { font-size: 16px; min-height: 80px; } /* 16px: iOS doesn't zoom into the field */
.askform .row { margin-top: 0; }
.script { margin-top: 12px; font-size: 16px; line-height: 2; }
.script { border-top: 1px solid var(--line); padding-top: 10px; }
.script div { padding: 2px 0; } .script .gap { height: 8px; } .script .key { color: var(--ok); font-weight: 600; } .script .sp { color: var(--muted); font-size: 13px; display: inline-block; width: 34px; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.spinner { width: 22px; height: 22px; border: 3px solid var(--chip); border-top-color: var(--accent); border-radius: 50%;
  animation: spin 1s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.bar-acc { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; min-width: 50px; }
.bar-acc i { display: block; height: 100%; }
h2 { font-size: 15px; margin: 0 0 10px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--chip); border-radius: 10px; padding: 10px; }
.kpi .v { font-size: 22px; font-weight: 650; } .kpi .l { font-size: 12px; color: var(--muted); }
form.gen { display: grid; gap: 10px; }
form.gen label { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
.pausenote { background: var(--warn-bg); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
.steprow { display: grid; grid-template-columns: auto 1fr 1.3fr auto; gap: 6px; align-items: center; font-size: 13px; }
.steprow input { width: 100%; }
.setgrid { display: grid; gap: 14px; }
.setgrid > label, .setgrid > div > .lbl { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
input[type=number] { font: inherit; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); }
textarea { resize: vertical; min-height: 180px; line-height: 1.45; }
select, input[type=text], textarea { font: inherit; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); width: 100%; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 13px; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--muted); }
.status-dot.on { background: var(--ok); }
.usage { display: grid; gap: 3px; font-size: 11px; color: var(--muted); min-width: 64px; cursor: pointer; }
.usage .m { display: flex; align-items: center; gap: 4px; }
.usage .m .bar-acc { width: 34px; min-width: 0; height: 5px; }
.ulist { display: grid; gap: 10px; }
.ulist .bar-acc { height: 8px; }
.sec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sec .kpi .v small { font-size: 13px; color: var(--muted); font-weight: 400; }
.mistake { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.mistake .question { font-size: 17px; margin: 6px 0; }
.mistake .opt { font-size: 16px; padding: 8px 12px; cursor: default; }
.mistake details { margin-bottom: 8px; }
.menuwrap { position: relative; flex: none; }
.lvwrap { margin-right: auto; }
.bar { flex-wrap: wrap; row-gap: 6px; }
.bar h1 { flex: none; }
/* JLPT level: a red stamp, like the 道 icon */
.lvbtn { border: 0; background: #d2303a; color: #fff; border-radius: 6px; padding: 3px 9px; font: inherit; font-size: 13px;
  font-weight: 700; letter-spacing: .03em; cursor: pointer; }
.furibtn { border: 1px dashed var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 4px 10px;
  font: inherit; font-size: 13px; white-space: nowrap; cursor: pointer; }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
/* iOS Safari blurs a band at the top of the page (just under the status bar), even when scrolled to
   the top: leave that band empty so the header is sharp. -webkit-touch-callout exists only on iOS. */
@supports (-webkit-touch-callout: none) {
  header { padding-top: calc(max(8px, env(safe-area-inset-top)) + 22px); }
}
/* mock exam: a different kind of mode: navy outline at the end of the row; filled only when selected */
.chips button.mockchip { margin-left: auto; border: 1.5px solid #1f2a44; color: #1f2a44; font-weight: 600; }
.chips button.mockchip.on { background: #1f2a44; color: #fff; }
@media (prefers-color-scheme: dark) {
  .chips button.mockchip { border-color: #8ea2d8; color: #8ea2d8; }
  .chips button.mockchip.on { background: #8ea2d8; color: #14161b; }
}
/* furigana control sits in the question card's top-right corner */
.furiwrap { margin-left: auto; }
.lvmenu.furimenu { left: auto; right: 0; min-width: 300px; }
/* phones: keep logo, level, usage and the ☰ menu on one row */
@media (max-width: 480px) {
  header { padding-left: 10px; padding-right: 10px; }
  .bar { gap: 6px; }
  .bar h1 { font-size: 16px; }
  .usage { min-width: 0; }
  .usage .m span:first-child { display: none; }
  .usage .m .bar-acc { width: 22px; }
  .furibtn { padding: 3px 8px; font-size: 12px; }
}
.lvmenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 220px; background: var(--card);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 6px; }
.lvmenu button, .lvpick button { display: flex; width: 100%; gap: 10px; align-items: baseline; border: 0; background: none;
  color: var(--ink); font: inherit; text-align: left; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.lvmenu button:hover, .lvmenu button.on { background: var(--chip); }
.lvmenu b, .lvpick b { width: 30px; } .lvmenu span, .lvpick span { color: var(--muted); font-size: 14px; }
.lvpick { display: grid; gap: 8px; margin: 14px 0 6px; }
.lvpick button { border: 1.5px solid var(--line); padding: 14px; font-size: 18px; }
.lvpick button:hover { border-color: var(--accent); }
tr.running td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.mockopts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 6px; }
.mockopt { display: grid; gap: 4px; text-align: left; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px;
  background: var(--card); color: var(--ink); font: inherit; cursor: pointer; }
.mockopt:hover { border-color: var(--accent); }
.mockopt b { font-size: 17px; } .mockopt span { color: var(--muted); font-size: 14px; line-height: 1.45; }
.mockopt:disabled { opacity: .5; }
@media (max-width: 480px) { .mockopts { grid-template-columns: 1fr; } }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 10; }
</style>
</head>
<body class="furi-tap">
<header>
  <div class="bar">
    <h1><img src="/static/icon-192.png?v=2" alt="" width="22" height="22" style="vertical-align:-4px;margin-right:6px;border-radius:5px">JStudy</h1>
    <div class="menuwrap lvwrap" id="levelWrap"><button class="lvbtn" id="levelBtn" aria-haspopup="true" aria-expanded="false" title="JLPT level">Level ▾</button>
      <div class="lvmenu" id="levelMenu" role="menu" hidden></div></div>
    <div class="usage" id="usage" title="Claude subscription usage"></div>
    <div class="menuwrap" id="navWrap"><button class="navbtn" id="navBtn" aria-haspopup="true" aria-expanded="false" aria-label="Menu" title="Menu">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div class="lvmenu navmenu" id="navMenu" role="menu" hidden></div></div>
  </div>
  <div class="studybar" id="studybar"><div class="chips" id="modes"></div></div>
</header>
<main id="main"></main>
<script>
const CATS = {vocab: "語彙", grammar: "文法", order: "組み立て", textgrammar: "文章の文法", reading: "読解", listening: "聴解"};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
// [漢字|かんじ] → <ruby>, 【word】 → underlined
const jp = s => esc(s).replace(/\[([^|\]]+)\|([^\]]+)\]/g, "<ruby>$1<rt>$2</rt></ruby>")
                      .replace(/【([^】]*)】/g, '<span class="u">$1</span>')
                      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const api = async (path, body) => {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  return r.json();
};
const toast = msg => { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 2500); };

let st = { tab: "study", mode: localStorage.mode || "mix", set: null, item: 0, answered: false, unsure: false,
  recent: [], stats: null, waitTimer: null, speed: +(localStorage.speed || 1) };
let furi = localStorage.furi || "tap";
// "Generate more" form: level = null follows the level badge; any other value is an override.
st.gen = {level: null, category: "mix", count: 10, focus: ""};
// Learner profile editor (Profile page): text = saved version, draft = what is in the box (kept across re-renders).
st.profile = {text: null, draft: null};
const PROFILE_HINT = `e.g.
- Native language: English. Taking the JLPT N3 in December.
- Background: two years with a textbook, a few minutes of Anki every day.
- Strong: grammar and reading. Weak: listening, and kanji words that look alike.
- Practise more: 即時応答.`;

const FURI = {off: ["off", "no readings"], tap: ["tap to reveal", "tap a word to see its reading"],
              on: ["on", "readings always shown"]};
if (!FURI[furi]) furi = "tap";
function applyFuri() {
  document.body.className = "furi-" + furi;
  if ($("#furiBtn")) $("#furiBtn").textContent = `ふりがな: ${FURI[furi][0]} ▾`;
}
// Placed in the meta line of question cards (it only matters where there is Japanese text).
const furiControl = () => `<span class="menuwrap furiwrap" id="furiWrap"><button type="button" class="furibtn" id="furiBtn"
  aria-haspopup="true" aria-expanded="false" title="Furigana (readings above kanji)">ふりがな: ${FURI[furi][0]} ▾</button>
  <span class="lvmenu furimenu" id="furiMenu" role="menu" hidden></span></span>`;
function bindFuri() {
  const b = $("#furiBtn");
  if (b) b.onclick = e => { e.stopPropagation(); toggleLevelMenu(false); toggleNavMenu(false); toggleFuriMenu(); };
}
function toggleFuriMenu(open) {
  const menu = $("#furiMenu");
  if (!menu) return;
  const show = open ?? menu.hidden;
  menu.hidden = !show;
  $("#furiBtn").setAttribute("aria-expanded", show);
  if (!show) return;
  menu.innerHTML = Object.entries(FURI).map(([k, [label, desc]]) =>
    `<button type="button" role="menuitemradio" aria-checked="${k === furi}" class="${k === furi ? "on" : ""}" data-furi="${k}">
      <b style="width:auto;min-width:96px">${label}${k === furi ? " ✓" : ""}</b><span>${desc}</span></button>`).join("");
  menu.querySelectorAll("[data-furi]").forEach(b => b.onclick = () => {
    furi = localStorage.furi = b.dataset.furi; applyFuri(); toggleFuriMenu(false); });
}

document.addEventListener("click", e => {
  const r = e.target.closest("ruby");
  if (r && furi === "tap") { r.classList.toggle("show"); e.stopPropagation(); e.preventDefault(); }
}, true);
// Page menu (☰, top right): Study, Profile, Settings.
const PAGES = [["study", "📖", "Study", "Questions, reviews and mock exams"],
               ["profile", "👤", "Profile", "Your progress, mistakes and About you"],
               ["settings", "⚙️", "Settings", "Claude usage, question generation, preferences"]];
function goTo(tab) {
  st.tab = tab; toggleNavMenu(false);
  $("#studybar").style.display = st.tab === "study" && st.stats?.level ? "" : "none";
  window.scrollTo(0, 0);
  st.tab === "study" ? (st.set ? render() : loadNext()) : renderStats();
}
function toggleNavMenu(open) {
  const menu = $("#navMenu"), show = open ?? menu.hidden;
  menu.hidden = !show;
  $("#navBtn").setAttribute("aria-expanded", show);
  if (!show) return;
  menu.innerHTML = PAGES.map(([k, icon, label, desc]) =>
    `<button type="button" role="menuitem" class="${k === st.tab ? "on" : ""}" data-page="${k}"${k === st.tab ? ' aria-current="page"' : ""}>
      <b style="width:22px">${icon}</b><span><b style="width:auto;color:var(--ink)">${label}</b><br>${desc}</span></button>`).join("");
  menu.querySelectorAll("[data-page]").forEach(b => b.onclick = () => goTo(b.dataset.page));
}
$("#navBtn").onclick = e => { e.stopPropagation(); toggleLevelMenu(false); toggleFuriMenu(false); toggleNavMenu(); };

function renderModes() {
  const s = st.stats, due = s ? s.reviews_due : 0;
  const modes = [["mix", "Mixed"], ["review", "Review" + (due ? `<span class="n">${due}</span>` : "")], ["mock", "📝 Mock exam"],
    ...Object.entries(CATS).map(([k, v]) => [k, v + (s ? `<span class="n">${s.categories[k].unseen}</span>` : "")])];
  const chip = ([k, v]) => `<button data-mode="${k}" class="${k === st.mode ? "on" : ""}${k === "mock" ? " mockchip" : ""}">${v}</button>`;
  $("#modes").innerHTML = `<div class="chiprow">${modes.slice(0, 3).map(chip).join("")}</div>
    <div class="chiprow">${modes.slice(3).map(chip).join("")}</div>`;
  $("#modes").querySelectorAll("button").forEach(b => b.onclick = () => {
    if (b.dataset.mode === st.mode && (st.set || st.mode === "mock")) return;   // already there: keep the current question
    mk.result = null; mk.stopping = false;
    st.mode = localStorage.mode = b.dataset.mode; renderModes(); st.set = null; loadNext();
  });
}

async function refreshStats() {
  st.stats = await api("/api/stats");
  // An automatic batch left over from the previous level can't be interrupted: say so instead of
  // showing its note. Requests and mock jobs for another level are wanted, so their note stays.
  const run = (st.stats.queue || []).find(j => j.status === "running");
  if (run && run.origin === "auto" && st.stats.level && run.level !== st.stats.level)
    st.stats.worker_note = `Finishing a batch of ${run.level} questions Claude already started (usually under a minute), then ${st.stats.level} begins.`;
  else if (run && run.origin === "request" && run.level !== st.stats.level && st.stats.worker_note)
    st.stats.worker_note += ` (you asked for ${run.level})`;
  $("#levelBtn").textContent = (st.stats.level || "Level") + " ▾";
  $("#studybar").style.display = st.tab === "study" && st.stats.level ? "" : "none";
  renderModes(); renderUsage();
}

// ------------------------------------------------------------ JLPT level
const LEVEL_INFO = {N5: "Beginner", N4: "Elementary", N3: "Intermediate", N2: "Upper intermediate", N1: "Advanced"};
const levelButtons = cur => Object.entries(LEVEL_INFO).map(([lv, d]) =>
  `<button type="button" role="menuitemradio" aria-checked="${lv === cur}" class="${lv === cur ? "on" : ""}" data-level="${lv}"><b>${lv}</b><span>${d}${lv === cur ? " ✓" : ""}</span></button>`).join("");

function toggleLevelMenu(open) {
  const menu = $("#levelMenu"), show = open ?? menu.hidden;
  menu.hidden = !show;
  $("#levelBtn").setAttribute("aria-expanded", show);
  if (!show) return;
  menu.innerHTML = levelButtons(st.stats?.level);
  menu.querySelectorAll("[data-level]").forEach(b => b.onclick = () => { toggleLevelMenu(false); setLevel(b.dataset.level); });
}
$("#levelBtn").onclick = e => { e.stopPropagation(); toggleFuriMenu(false); toggleNavMenu(false); toggleLevelMenu(); };
document.addEventListener("click", e => {
  if (!e.target.closest("#levelWrap")) toggleLevelMenu(false);
  if (!e.target.closest("#furiWrap")) toggleFuriMenu(false);
  if (!e.target.closest("#navWrap")) toggleNavMenu(false);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { toggleLevelMenu(false); toggleFuriMenu(false); toggleNavMenu(false); } });

async function setLevel(lv) {
  const first = !st.stats?.level;
  if (lv === st.stats?.level) return;
  const r = await api("/api/level", {level: lv});
  if (r.error) return toast(r.error);
  st.set = null; st.recent = []; mk.result = null;
  st.gen.level = null;                     // a new level from the badge resets any override
  if (!first) toast(`Switched to ${lv}. Each level keeps its own questions and progress.`);
  await refreshStats();
  if (first || st.tab === "study") goTo("study");
  else renderStats();
}

// First visit: no level chosen yet, so nothing can be generated.
function renderWelcome() {
  $("#studybar").style.display = "none";
  $("#main").innerHTML = `<div class="card"><h2 style="font-size:20px">Welcome to JStudy</h2>
    <p>Which JLPT level are you studying for? Claude starts writing questions for it as soon as you choose.</p>
    <div class="lvpick">${levelButtons(null)}</div>
    <p class="muted">You can switch level any time with the badge next to the title. Each level keeps its own
      questions, statistics, reviews and mock exams.</p></div>`;
  $("#main").querySelectorAll("[data-level]").forEach(b => b.onclick = () => setLevel(b.dataset.level));
}

// Claude subscription usage, as reported to the worker by headless Claude
function usageColor(p) { return p >= 85 ? "var(--bad)" : p >= 60 ? "#d9a200" : "var(--ok)"; }
function resetText(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000), mins = Math.round((d - Date.now()) / 60000);
  if (mins <= 0) return "reset now";
  const t = d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  return mins < 24 * 60 ? `resets ${t} (in ${mins >= 60 ? Math.floor(mins / 60) + "h " : ""}${mins % 60}m)`
                        : `resets ${d.toLocaleDateString([], {weekday: "short"})} ${t}`;
}
function usageWindows() {
  const u = st.stats?.usage || {};
  return [["five_hour", "5h"], ["seven_day", "week"]].filter(([k]) => u[k]?.used != null)
    .map(([k, l]) => ({key: k, label: l, pct: Math.round(u[k].used * 100), reset: u[k].resets_at}));
}
function renderUsage() {
  const w = usageWindows();
  $("#usage").innerHTML = w.map(x => `<div class="m"><span style="width:28px">${x.label}</span><div class="bar-acc"><i style="width:${x.pct}%;background:${usageColor(x.pct)}"></i></div>${x.pct}%</div>`).join("");
}
$("#usage").onclick = () => goTo("settings");

async function loadNext() {
  clearTimeout(st.waitTimer);
  if (st.mode === "mock") return loadMock();
  const r = await api(`/api/next?mode=${st.mode}&exclude=${st.recent.join(",")}`);
  if (r.need_level) { st.set = null; refreshStats(); return renderWelcome(); }
  st.set = r.set; st.item = 0; st.answered = false; st.unsure = false; st.message = r.message;
  render();
  refreshStats();
  if (!r.set && st.mode !== "review") st.waitTimer = setTimeout(() => st.tab === "study" && !st.set && loadNext(), 8000);
}

function playerHtml(s) {
  return `<div class="player"><button class="play" id="playBtn">▶ Play</button>
    <span class="speed">${[0.8, 0.9, 1, 1.15].map(v => `<button data-sp="${v}" class="${v === st.speed ? "on" : ""}">${v}×</button>`).join("")}</span>
    <audio id="aud" preload="auto" src="/audio/${esc(s.audio)}"></audio></div>`;
}

function render() {
  if (st.tab !== "study") return;
  const m = $("#main"), s = st.set;
  if (!s) {
    const note = st.stats?.worker_note || (st.mode !== "review" ? st.stats?.auto_paused : "");
    m.innerHTML = `<div class="card empty">${st.mode !== "review" ? '<div class="spinner"></div>' : ""}
      <div>${esc(st.message || "")}</div>${note ? `<div class="muted" style="margin-top:8px">${esc(note)}</div>` : ""}
      ${st.mode === "review" ? '<div class="row" style="justify-content:center"><button class="small" onclick="st.mode=localStorage.mode=\'mix\';renderModes();loadNext()">Study mixed questions</button></div>' : ""}</div>`;
    return;
  }
  const it = s.items[st.item], listening = s.category === "listening", hideOpts = it.audio_options && !st.answered;
  const multi = s.items.length > 1;
  m.innerHTML = `<div class="card">
    <div class="meta"><span class="tag">${CATS[s.category]}</span><span class="tag">${esc(s.subtype || "")}</span>
      ${s.reason === "review" ? '<span class="tag review">review</span>' : ""}${s.item_map && s.item_count > s.items.length
        ? `<span class="tag">only the ${s.items.length === 1 ? "question" : s.items.length + " questions"} you missed, of ${s.item_count}</span>` : ""}${s.origin === "request" ? '<span class="tag">requested</span>' : ""}
      ${multi ? `<span>Question ${st.item + 1} / ${s.items.length}</span>` : ""}${furiControl()}</div>
    ${multi ? `<div class="prog"><i style="width:${(st.item / s.items.length) * 100}%"></i></div>` : ""}
    ${listening ? playerHtml(s) : ""}
    ${s.passage ? `<div class="passage">${jp(s.passage)}</div>` : ""}
    <div class="question">${listening && !st.answered ? '<span class="muted">Listen, then choose.</span>' : jp(it.question)}</div>
    <div class="opts">${it.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="num">${i + 1}</span>
      <span>${hideOpts ? '<span class="muted">(audio)</span>' : jp(o)}</span></button>`).join("")}</div>
    <div class="row" id="pre"><button class="unsure ${st.unsure ? "on" : ""}" id="unsureBtn">🤔 not sure</button>${dropBtn(s)}</div>
    <div id="post"></div>
  </div>`;
  m.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
  $("#unsureBtn").onclick = () => { st.unsure = !st.unsure; $("#unsureBtn").classList.toggle("on", st.unsure); };
  bindDrop();
  bindFuri();
  if (listening) setupPlayer();
}

function setupPlayer() {
  const a = $("#aud"), b = $("#playBtn");
  a.playbackRate = st.speed;
  b.onclick = () => a.paused ? a.play() : a.pause();
  a.onplay = () => b.textContent = "❚❚ Pause";
  a.onpause = () => b.textContent = "▶ Play";
  a.onended = () => b.textContent = "↻ Replay";
  document.querySelectorAll(".speed button").forEach(x => x.onclick = () => {
    st.speed = +x.dataset.sp; localStorage.speed = st.speed; a.playbackRate = st.speed;
    document.querySelectorAll(".speed button").forEach(y => y.classList.toggle("on", y === x));
  });
}

async function answer(i) {
  if (st.answered) return;
  st.answered = true; st.chosen = i;
  const s = st.set, it = s.items[st.item];
  const r = await api("/api/answer", {set_id: s.id, item: s.item_map ? s.item_map[st.item] : st.item, chosen: i, unsure: st.unsure});
  st.answerId = r.answer_id;
  st.recent = [s.id, ...st.recent.filter(x => x !== s.id)].slice(0, 6);
  const a = $("#aud");
  if (s.category === "listening" || it.audio_options) {
    // re-render to reveal question/options text, keep the audio element state
    const wasPlaying = a && !a.paused, t = a ? a.currentTime : 0;
    render();
    const a2 = $("#aud"); if (a2) { a2.currentTime = t; if (wasPlaying) a2.play(); }
  }
  document.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    const k = +b.dataset.i;
    if (k === r.answer) b.classList.add("right"); else if (k === i) b.classList.add("wrong");
  });
  $("#pre").style.display = "none";
  const last = st.item === s.items.length - 1;
  $("#post").innerHTML = `<div class="result ${r.correct ? "ok" : "bad"}">
      <b>${r.correct ? (st.unsure ? "Correct (marked unsure, it will come back)" : "Correct") : "Wrong, it will come back for review"}</b>${jp(it.explanation)}</div>
    ${s.script ? transcript(s, it, r.answer) : ""}
    <button type="button" class="askbtn" id="askBtn" aria-expanded="false" aria-controls="askPanel">💬 Ask Claude about this question</button>
    <div id="askPanel" hidden></div>
    <div class="row"><button class="small" id="undoBtn" title="Mis-tapped? Take the answer back (key: u)">↶ Undo</button>
      <button class="link" id="flagBtn">Report a problem with this question</button>${dropBtn(s)}
      <button class="next" id="nextBtn">${last ? "Next →" : "Next question →"}</button></div>`;
  $("#nextBtn").onclick = next;
  $("#flagBtn").onclick = flag;
  $("#undoBtn").onclick = undo;
  $("#askBtn").onclick = toggleAsk;
  if (st.ask.key === askKey() && st.ask.msgs.length) toggleAsk();   // answered again after undo: keep the chat open
  bindDrop();
  $("#nextBtn").focus({preventScroll: true});
  $("#post").scrollIntoView({behavior: "smooth", block: "nearest"});
}

// Everything the audio says, in order: script lines, then (when the choices
// are only heard) the numbered choices as read, with the right one marked.
function transcript(s, it, key) {
  const SP = {N: "📢", M: "男", F: "女"};
  const line = (sp, html, cls = "") => `<div class="${cls}"><span class="sp">${sp}</span>${html}</div>`;
  let html = s.script.map(l => line(SP[l.speaker] || "", jp(l.text))).join("");
  if (it.audio_options) {
    const first = s.script[0]?.speaker;
    const who = s.subtype === "即時応答" ? (first === "M" ? "女" : "男") : "📢";
    html += '<div class="gap"></div>' + it.options.map((o, i) =>
      line(who, `<b>${i + 1}.</b> ${jp(o)}${i === key ? " ✓" : ""}`, i === key ? "key" : "")).join("");
  }
  return `<div class="script"><div class="muted" style="margin-bottom:4px">Transcript</div>${html}</div>`;
}

// ---- Ask Claude about the question just answered. The worker answers (with the question, passage
// or script, options, the right answer and the student's choice as context); the page polls for it.
st.ask = {key: null, msgs: []};
const askKey = () => st.set ? `${st.set.id}:${st.set.item_map ? st.set.item_map[st.item] : st.item}` : null;
const askItem = () => st.set.item_map ? st.set.item_map[st.item] : st.item;
function fmtAnswer(t) {   // plain text from Claude → paragraphs and "- " lists, with furigana markup
  return t.trim().split(/\n\s*\n/).map(block => {
    const lines = block.split("\n");
    return lines.every(l => /^\s*[-•] /.test(l))
      ? `<ul>${lines.map(l => `<li>${jp(l.replace(/^\s*[-•] /, ""))}</li>`).join("")}</ul>`
      : `<p>${lines.map(jp).join("<br>")}</p>`;
  }).join("");
}
function renderAskLog() {
  const log = $("#askLog");
  if (!log) return;
  log.innerHTML = st.ask.msgs.map(m => `<div class="msg me">${esc(m.question)}</div>` + (
    m.status === "done" ? `<div class="msg ai">${fmtAnswer(m.answer || "")}</div>`
    : m.status === "failed" ? `<div class="msg ai err">Sorry, no answer: ${esc(m.error || "something went wrong")}. Try again in a moment.</div>`
    : '<div class="msg ai"><span class="thinking">Claude is thinking…</span></div>')).join("");
}
function toggleAsk() {
  const panel = $("#askPanel"), btn = $("#askBtn"), open = panel.hidden;
  panel.hidden = !open; btn.setAttribute("aria-expanded", open);
  if (!open) return;
  const key = askKey();
  if (st.ask.key !== key) st.ask = {key, msgs: []};
  const s = st.stats, online = s?.worker_seen && (Date.now() - new Date(s.worker_seen.replace(" ", "T"))) < 90000;
  panel.innerHTML = `<div class="ask"><div class="log" id="askLog"></div>
    <form class="askform" id="askForm" autocomplete="off">
      <textarea name="message" rows="3" autocomplete="off" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other" autocapitalize="sentences" spellcheck="true" maxlength="1000" placeholder="e.g. Why is the other option wrong? Can I also say it like this: …?"></textarea>
      <div class="row"><span class="muted" style="flex:1">${online ? "Claude knows this question and your answer." : "⚠ The worker looks offline, so answers may not come."}</span>
        <button class="next" style="margin:0" id="askSend">Send</button></div>
    </form></div>`;
  renderAskLog();
  const form = $("#askForm"), ta = form.elements.namedItem("message");
  ta.focus({preventScroll: true});                     // inside the tap, so phones open the keyboard
  setTimeout(() => ta.scrollIntoView({block: "center", behavior: "smooth"}), 300);
  ta.onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); form.requestSubmit(); } };
  form.onsubmit = e => { e.preventDefault(); sendAsk(ta); };
  if (!st.ask.loaded) loadAskHistory(key);
}
async function loadAskHistory(key) {
  const [sid, item] = key.split(":");
  const r = await api(`/api/asks?set_id=${sid}&item=${item}`);
  if (st.ask.key !== key) return;
  const known = new Set(st.ask.msgs.map(m => m.id));
  st.ask.msgs = [...(r.asks || []).filter(a => !known.has(a.id)), ...st.ask.msgs];
  st.ask.loaded = true;
  renderAskLog();
  st.ask.msgs.filter(m => m.status === "pending" || m.status === "running").forEach(m => pollAsk(m, key));
}
async function sendAsk(ta) {
  const question = ta.value.trim();
  if (!question) return ta.focus();
  const btn = $("#askSend"); btn.disabled = true;
  const r = await api("/api/ask", {set_id: st.set.id, item: askItem(), chosen: st.chosen ?? null, question});
  btn.disabled = false;
  if (r.error) return toast(r.error);
  const m = {id: r.id, question, status: "pending"};
  st.ask.msgs.push(m); ta.value = "";
  renderAskLog();
  $("#askLog").lastElementChild.scrollIntoView({block: "nearest", behavior: "smooth"});
  pollAsk(m, st.ask.key);
}
async function pollAsk(m, key, started = Date.now()) {
  if (st.ask.key !== key) return;                     // moved on to another question
  const r = await api(`/api/ask?id=${m.id}`);
  Object.assign(m, {status: r.status, answer: r.answer, error: r.error});
  if (r.status === "pending" || r.status === "running") {
    if (Date.now() - started > 240000) { m.status = "failed"; m.error = "no answer after 4 minutes (is the worker running?)"; }
    else return setTimeout(() => pollAsk(m, key, started), 1500);
  }
  renderAskLog();
  if (m.status === "done") $("#askLog")?.lastElementChild?.scrollIntoView({block: "nearest", behavior: "smooth"});
}

// Reviews only: leave the review cycle for good ("I know this now", or not worth repeating).
const dropBtn = s => s.reason === "review" ? '<button class="link dropBtn" title="This question will not come back for review">Don\'t review again</button>' : "";
function bindDrop() {
  document.querySelectorAll(".dropBtn").forEach(b => b.onclick = async () => {
    if (!confirm("Stop reviewing this question? It won't come back. Your answers stay in your statistics.")) return;
    const r = await api("/api/review/drop", {set_id: st.set.id});
    if (!r.ok) return toast("Could not remove it.");
    toast("Removed from your reviews.");
    await refreshStats(); window.scrollTo(0, 0); loadNext();
  });
}

async function undo() {
  const r = await api("/api/undo", {answer_id: st.answerId});
  if (!r.ok) { toast("Too late to undo this one."); return; }
  st.answered = false; st.answerId = null;
  render();
  toast("Answer removed. Choose again.");
}

function next() {
  const s = st.set;
  if (st.item < s.items.length - 1) { st.item++; st.answered = false; st.unsure = false; render(); window.scrollTo(0, 0); }
  else { window.scrollTo(0, 0); loadNext(); }
}

async function flag() {
  const note = prompt("What's wrong? (wrong answer key, two correct options, bad audio, unnatural Japanese…)");
  if (note === null) return;
  await api("/api/flag", {set_id: st.set.id, note});
  toast("Reported. This question won't be shown again.");
  loadNext();
}

// ---------------------------------------------------------------- mock exam
// No feedback while answering (like the real exam): pick, then confirm with Next.
// Scores and a review of every mistake at the end.
let mk = {sel: null, unsure: false, data: null, result: null};

async function loadMock() {
  clearTimeout(st.waitTimer);
  mk.data = await api("/api/mock");
  if (mk.data.need_level) { refreshStats(); return renderWelcome(); }
  renderMock();
  refreshStats();
}

// Real exams allow roughly 1.4 minutes per question.
function duration(n) {
  const min = Math.round(n * 1.4 / 10) * 10, h = Math.floor(min / 60), m = min % 60;
  return "about " + (h ? `${h} h` : "") + (h && m ? " " : "") + (m ? `${m} min` : "");
}

function mockNext(d) {
  for (const s of d.sets) for (let i = 0; i < s.items.length; i++)
    if (!(`${s.id}:${i}` in d.answered)) return {s, i};
  return null;
}

function renderMock() {
  if (st.tab !== "study" || st.mode !== "mock") return;
  const m = $("#main"), d = mk.data;
  if (mk.result) return renderMockResult(mk.result);
  if (!d.mock) {
    const SECTIONS = d.scoring.sections;
    m.innerHTML = `<div class="card"><h2>${d.level} mock exam</h2>
      <p>The real ${d.level} structure without the picture questions (発話表現). Untimed. No answers are shown until the end, then you get
      a score per section and a review of every mistake. Unseen questions are used first; Claude writes the missing ones in exam order while you answer.</p>
      <div class="mockopts">${["half", "full"].map(sz => `<button class="mockopt" data-size="${sz}">
        <b>${sz === "half" ? "Half" : "Full"} mock</b><span>~${d.sizes[sz]} questions · ${duration(d.sizes[sz])}</span></button>`).join("")}</div>
      <p class="muted">Mistakes also enter the normal review cycle. Changed your mind? You can stop a mock at any time and
        discard it, as if you never started.</p></div>
      ${d.history.length ? `<div class="card"><h2>Past ${d.level} mocks</h2><table><tr><th>Date</th>${SECTIONS.map(x => `<th>${x}</th>`).join("")}<th></th></tr>
        ${d.history.map(h => `<tr><td>${esc(h.finished_at.slice(5, 16))} <span class="muted">${h.size}</span></td>
          ${SECTIONS.map(x => { const v = h.sections[x]; return `<td>${v && v.total ? Math.round(100 * v.correct / v.total) + "%" : "–"}</td>`; }).join("")}
          <td><button class="link" data-res="${h.id}">open</button></td></tr>`).join("")}</table></div>` : ""}`;
    m.querySelectorAll("[data-size]").forEach(b => b.onclick = async () => {
      b.disabled = true;
      const r = await api("/api/mock/start", {size: b.dataset.size});
      if (r.error) toast(r.error);
      loadMock();
    });
    m.querySelectorAll("[data-res]").forEach(b => b.onclick = () => openResult(+b.dataset.res));
    return;
  }
  const done = Object.keys(d.answered).length;
  const total = d.mock.total_items;
  const nx = mockNext(d);
  const head = `<div class="meta"><span class="tag">📝 ${d.mock.level} ${d.mock.size} mock</span><span>${done} / ~${total}</span>
      <button class="link" id="abandonBtn" style="margin-left:auto">stop mock</button></div>
    <div class="prog"><i style="width:${Math.min(100, 100 * done / total)}%"></i></div>`;
  if (mk.stopping) {
    m.innerHTML = `<div class="card">${head}<h2>Stop this mock?</h2>
      <div class="mockopts">
        <button class="mockopt" id="discardBtn"><b>Discard it</b><span>Deletes this mock and the ${done} answer(s) you gave,
          as if you never started. The questions go back to your pool.</span></button>
        <button class="mockopt" id="keepBtn"><b>Stop, keep my answers</b><span>They count in your stats and wrong ones come back
          for review. The mock gets no score.</span></button>
      </div>
      <div class="row" style="justify-content:center"><button class="link" id="resumeBtn">← continue the mock</button></div></div>`;
    $("#discardBtn").onclick = () => stopMock(true);
    $("#keepBtn").onclick = () => stopMock(false);
    $("#resumeBtn").onclick = () => { mk.stopping = false; renderMock(); };
    $("#abandonBtn").remove();
    return;
  }
  if (!nx) {
    const missing = d.slots.reduce((n, sl) => n + sl.count - sl.filled, 0);
    const waiting = missing > 0 && d.pending > 0;
    m.innerHTML = `<div class="card">${head}<div class="empty">
      ${waiting ? `<div class="spinner"></div><div>Claude is writing the next questions (${missing} set(s) to go)…</div>
        <div class="muted" style="margin-top:6px">${esc(st.stats?.worker_note || "")}</div>`
        : `<div>${missing ? `${missing} set(s) could not be prepared; they are skipped.` : "All questions answered."}</div>`}
      <div class="row" style="justify-content:center"><button class="${waiting ? "small" : "next"}" id="finishBtn">${waiting ? "Finish now" : "See results"}</button></div></div></div>`;
    $("#finishBtn").onclick = finishMock;
    $("#abandonBtn").onclick = abandonMock;
    if (waiting) st.waitTimer = setTimeout(() => st.mode === "mock" && st.tab === "study" && loadMock(), 8000);
    return;
  }
  const {s, i} = nx, it = s.items[i], listening = s.category === "listening";
  if (mk.key !== `${s.id}:${i}`) { mk.key = `${s.id}:${i}`; mk.sel = null; mk.unsure = false; }
  m.innerHTML = `<div class="card">${head}
    <div class="meta"><span class="tag">${CATS[s.category]}</span><span class="tag">${esc(s.subtype || "")}</span>
      ${s.items.length > 1 ? `<span>Question ${i + 1} / ${s.items.length}</span>` : ""}${furiControl()}</div>
    ${listening ? playerHtml(s) : ""}
    ${s.passage ? `<div class="passage">${jp(s.passage)}</div>` : ""}
    <div class="question">${listening ? '<span class="muted">Listen, then choose.</span>' : jp(it.question)}</div>
    <div class="opts">${it.options.map((o, k) => `<button class="opt ${mk.sel === k ? "sel" : ""}" data-i="${k}"><span class="num">${k + 1}</span>
      <span>${it.audio_options ? '<span class="muted">(audio)</span>' : jp(o)}</span></button>`).join("")}</div>
    <div class="row"><button class="unsure ${mk.unsure ? "on" : ""}" id="unsureBtn">🤔 not sure</button>
      <button class="next" id="mockNextBtn" ${mk.sel === null ? "disabled style=\"opacity:.4\"" : ""}>Next →</button></div></div>`;
  m.querySelectorAll(".opt").forEach(b => b.onclick = () => mockSelect(+b.dataset.i));
  $("#unsureBtn").onclick = () => { mk.unsure = !mk.unsure; $("#unsureBtn").classList.toggle("on", mk.unsure); };
  $("#mockNextBtn").onclick = mockConfirm;
  $("#abandonBtn").onclick = abandonMock;
  bindFuri();
  if (listening) setupPlayer();
}

function mockSelect(k) {
  mk.sel = k;
  document.querySelectorAll(".opt").forEach(b => b.classList.toggle("sel", +b.dataset.i === k));
  const n = $("#mockNextBtn"); n.disabled = false; n.style.opacity = "";
}

async function mockConfirm() {
  if (mk.sel === null || mk.busy) return;
  mk.busy = true;
  const [sid, i] = mk.key.split(":").map(Number);
  await api("/api/answer", {set_id: sid, item: i, chosen: mk.sel, unsure: mk.unsure, mock_id: mk.data.mock.id});
  mk.busy = false;
  window.scrollTo(0, 0);
  loadMock();
}

async function finishMock() {
  const r = await api("/api/mock/finish", {});
  if (r.ok) openResult(r.id);
}

function abandonMock() { mk.stopping = true; renderMock(); window.scrollTo(0, 0); }

async function stopMock(discard) {
  const r = await api("/api/mock/abandon", {discard});
  mk.stopping = false;
  if (r.error) toast(r.error);
  else toast(discard ? "Mock discarded, as if it never happened." : "Mock stopped. Your answers were kept.");
  loadMock();
}

async function deleteMock(id) {
  if (!confirm("Delete this mock and all its answers? Your stats and reviews will be as if you never took it.")) return;
  const r = await api("/api/mock/delete", {id});
  if (r.error) return toast(r.error);
  mk.result = null;
  toast("Mock deleted.");
  loadMock();
}

async function openResult(id) {
  mk.result = await api(`/api/mock/result?id=${id}`);
  renderMock();
  window.scrollTo(0, 0);
}

function renderMockResult(r) {
  const pctOf = v => v && v.total ? Math.round(100 * v.correct / v.total) : null;
  const SECTIONS = r.scoring.sections, sc = r.scoring;
  const maxTotal = SECTIONS.reduce((n, x) => n + sc.max[x], 0);
  const all = SECTIONS.reduce((a, x) => ({correct: a.correct + (r.sections[x]?.correct || 0), total: a.total + (r.sections[x]?.total || 0)}), {correct: 0, total: 0});
  $("#main").innerHTML = `<div class="card"><div class="meta"><span class="tag">📝 ${r.level} ${r.size} mock</span><span>${esc((r.finished_at || "").slice(0, 16))}</span>
      <button class="link" id="backBtn" style="margin-left:auto">← mocks</button></div>
    <h2>Score: ${all.correct} / ${all.total} (${pctOf(all) ?? "–"}%)</h2>
    <div class="sec">${SECTIONS.map(x => { const v = r.sections[x], p = pctOf(v);
      return `<div class="kpi"><div class="v">${p ?? "–"}${p !== null ? "%" : ""} <small>${v ? v.correct + "/" + v.total : ""}</small></div><div class="l">${x}</div>${accBar(p)}</div>`; }).join("")}</div>
    <p class="muted">Raw scores, only a rough guide: the real exam converts them to scaled scores. To pass ${r.level} you need
      ${sc.pass_total}/${maxTotal} overall and at least ${SECTIONS.map(x => `${sc.pass_section[x]}/${sc.max[x]} in ${x}`).join(" and ")};
      aiming for about 60%+ in every section here gives a comfortable margin.</p>
    <table><tr><th>Type</th><th class="num">Score</th></tr>${r.slots.filter(x => x.total).map(x => `<tr><td>${esc(x.subtype)}</td>
      <td class="num">${x.correct}/${x.total}</td></tr>`).join("")}</table></div>
  <div class="card"><h2>Mistakes and unsure answers (${r.review.length})</h2>
    ${r.review.length ? r.review.map(reviewHtml).join("") : '<p class="muted">None. よくできました！</p>'}</div>
  <div class="row" style="justify-content:center"><button class="link" id="deleteMockBtn">Delete this mock (removes it and its answers)</button></div>`;
  $("#deleteMockBtn").onclick = () => deleteMock(r.id);
  $("#backBtn").onclick = () => { mk.result = null; loadMock(); };
}

function reviewHtml(s) {
  const parts = s.items.map((it, i) => {
    const mark = s.marks[i];
    if (mark.correct && !mark.unsure) return "";
    return `<div class="question">${jp(it.question)}</div>
      <div class="opts">${it.options.map((o, k) => `<div class="opt ${k === it.answer ? "right" : k === mark.chosen ? "wrong" : ""}">
        <span class="num">${k + 1}</span><span>${jp(o)}</span></div>`).join("")}</div>
      <div class="result ${mark.correct ? "ok" : "bad"}"><b>${mark.chosen === null ? "Not answered" : mark.correct ? "Correct, but unsure" : "Wrong"}</b>${jp(it.explanation)}</div>
      ${s.script ? transcript(s, it, it.answer) : ""}`;
  }).join("");
  return `<div class="mistake"><div class="meta"><span class="tag">${CATS[s.category]}</span><span class="tag">${esc(s.subtype || "")}</span></div>
    ${s.audio ? `<audio controls preload="none" src="/audio/${esc(s.audio)}" style="width:100%;margin-bottom:8px"></audio>` : ""}
    ${s.passage ? `<details><summary class="muted">Passage</summary><div class="passage">${jp(s.passage)}</div></details>` : ""}${parts}</div>`;
}

document.addEventListener("keydown", e => {
  if (st.tab === "study" && st.mode === "mock" && mk.data?.mock && !mk.result && !e.target.matches("input,select,textarea")) {
    if (/^[1-4]$/.test(e.key) && document.querySelector(`.opt[data-i="${+e.key - 1}"]`)) mockSelect(+e.key - 1);
    else if (e.key === "Enter") mockConfirm();
    else if (e.key === "p") $("#playBtn")?.click();
    return;
  }
});
document.addEventListener("keydown", e => {
  if (st.tab !== "study" || !st.set || e.target.matches("input,select,textarea")) return;
  if (!st.answered && /^[1-4]$/.test(e.key) && +e.key <= st.set.items[st.item].options.length) answer(+e.key - 1);
  else if (st.answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); next(); }
  else if (e.key === "p") $("#playBtn")?.click();
  else if (st.answered && e.key === "u") $("#undoBtn")?.click();
});

function jobLabel(j) {
  const why = {auto: "auto", mock: "mock exam", request: "asked"}[j.origin] || j.origin;
  return `<b>${esc(j.level || "")}</b> ${CATS[j.category]} <span class="muted">${why}${j.focus && j.origin !== "mock" ? " · " + esc(j.focus) : ""}</span>`;
}

function pct(ok, n) { return n ? Math.round(100 * ok / n) : null; }
function accBar(p) {
  if (p === null) return '<span class="muted">–</span>';
  const c = p >= 80 ? "var(--ok)" : p >= 60 ? "#d9a200" : "var(--bad)";
  return `<div style="display:flex;gap:6px;align-items:center"><div class="bar-acc" style="flex:1"><i style="width:${p}%;background:${c}"></i></div><span>${p}%</span></div>`;
}

// ---- Preferences (Settings page): edited as a draft, saved with one button.
const UNITS = [["weeks", 10080], ["days", 1440], ["hours", 60], ["minutes", 1]];
const PAUSE_CHOICES = [50, 60, 70, 75, 80, 85, 90, 95];
function pauseText(se) {
  if (!se) return "your pause limits";
  const p = [se.pause_5h != null ? `${se.pause_5h}% of the 5-hour limit` : null,
             se.pause_week != null ? `${se.pause_week}% of the weekly limit` : null].filter(Boolean);
  return p.length ? p.join(" or ") : "no limit (pausing is off)";
}
function splitMinutes(m) { const [u, k] = UNITS.find(([, k]) => m % k === 0); return {n: m / k, unit: u}; }
function settingsDraft() {
  if (!st.settings) st.settings = JSON.parse(JSON.stringify(st.stats.settings));
  return st.settings;
}
function settingsCard() {
  const d = settingsDraft(), saved = JSON.stringify(st.stats.settings), dirty = JSON.stringify(d) !== saved;
  const pauseSel = (name, v) => `<select data-set="${name}">${[...new Set([...PAUSE_CHOICES, ...(v != null ? [v] : [])])].sort((a, b) => a - b)
      .map(x => `<option value="${x}" ${x === v ? "selected" : ""}>Pause at ${x}%</option>`).join("")}
      <option value="off" ${v == null ? "selected" : ""}>Never pause</option></select>`;
  return `<div class="card"><h2>Preferences</h2><div class="setgrid">
    <label>Claude model that writes the questions<select data-set="model">
      ${[["opus", "Opus (Recommended): most reliable questions"], ["sonnet", "Sonnet: uses less usage, more mistakes"],
         ["haiku", "Haiku: uses the least, most mistakes"]].map(([k, t]) => `<option value="${k}" ${d.model === k ? "selected" : ""}>${t}</option>`).join("")}
    </select></label>
    <label>5-hour usage limit${pauseSel("pause_5h", d.pause_5h)}</label>
    <label>Weekly usage limit${pauseSel("pause_week", d.pause_week)}</label>
    <div><div class="lbl">Review steps <span class="muted">(a wrong or unsure question comes back after each wait in turn; a correct
      review moves it to the next step, and after the last one it leaves the review cycle)</span></div>
      <div style="display:grid;gap:6px;margin-top:6px">${d.review_steps.map((m, i) => { const {n, unit} = splitMinutes(m); return `<div class="steprow">
        <span>${i + 1}.</span><input type="number" min="1" max="999" autocomplete="off" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other" value="${n}" data-step="${i}">
        <select data-stepunit="${i}">${UNITS.map(([u]) => `<option ${u === unit ? "selected" : ""}>${u}</option>`).join("")}</select>
        ${d.review_steps.length > 1 ? `<button type="button" class="small" data-steprm="${i}" aria-label="Remove step">✕</button>` : "<span></span>"}</div>`; }).join("")}
      ${d.review_steps.length < 5 ? '<div><button type="button" class="small" id="stepAdd">+ Add step</button></div>' : ""}</div></div>
    <div><div class="lbl">Questions kept ready</div><div class="seg" style="margin-top:4px">${[["small", "Small"], ["normal", "Normal"], ["large", "Large"]]
      .map(([k, t]) => `<button type="button" class="small${d.stock === k ? " on" : ""}" data-stock="${k}">${t}</button>`).join("")}</div>
      <span class="muted">How many unseen questions per section Claude keeps written in advance. Large means less waiting on long study days, but uses more Claude usage.</span></div>
    <label>When Claude writes questions<select data-set="schedule">
      <option value="studying" ${d.schedule === "studying" ? "selected" : ""}>Only while I'm studying</option>
      <option value="always" ${d.schedule === "always" ? "selected" : ""}>Anytime, also while I'm away</option></select>
      <span class="muted">"Studying" = the app was used in the last 45 minutes. Either way Claude stops once the questions kept ready are written.</span></label>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button type="button" class="next" id="setSave" style="margin:0;flex:0 0 auto;padding-inline:22px" ${dirty ? "" : "disabled"}>Save</button>
      <button type="button" class="small" id="setReset">Defaults</button>
      <span class="muted">${dirty ? "Unsaved changes" : ""}</span></div>
  </div></div>`;
}
function bindSettings() {
  const d = settingsDraft(), redraw = () => renderStats();
  document.querySelectorAll("[data-set]").forEach(el => el.onchange = () => {
    const k = el.dataset.set, v = el.value;
    d[k] = k.startsWith("pause_") ? (v === "off" ? null : +v) : v; redraw();
  });
  const stepVal = i => {
    const n = Math.max(1, Math.round(+document.querySelector(`[data-step="${i}"]`).value || 1));
    const k = UNITS.find(([u]) => u === document.querySelector(`[data-stepunit="${i}"]`).value)[1];
    d.review_steps[i] = Math.min(n * k, 525600);
  };
  document.querySelectorAll("[data-step]").forEach(el => el.onchange = () => { stepVal(+el.dataset.step); redraw(); });
  document.querySelectorAll("[data-stepunit]").forEach(el => el.onchange = () => { stepVal(+el.dataset.stepunit); redraw(); });
  document.querySelectorAll("[data-steprm]").forEach(el => el.onclick = () => { d.review_steps.splice(+el.dataset.steprm, 1); redraw(); });
  const add = $("#stepAdd");
  if (add) add.onclick = () => { const last = d.review_steps.at(-1); d.review_steps.push(Math.min(last * 2, 525600)); redraw(); };
  document.querySelectorAll("[data-stock]").forEach(el => el.onclick = () => { d.stock = el.dataset.stock; redraw(); });
  $("#setReset").onclick = () => { st.settings = {model: "opus", pause_5h: 85, pause_week: 90, review_steps: [10, 1440, 4320],
                                                  stock: "normal", schedule: "studying"}; redraw(); };
  $("#setSave").onclick = async () => {
    const r = await api("/api/settings", d);
    if (r.error) return toast(r.error);
    st.settings = null; toast("Settings saved."); renderStats();
  };
}

  ${P ? `<div class="card"><div class="kpis">
    <div class="kpi"><div class="v">${s.today.answered}</div><div class="l">answered today</div></div>
    <div class="kpi"><div class="v">${tp === null ? "–" : tp + "%"}</div><div class="l">sure &amp; correct today</div></div>
    <div class="kpi"><div class="v">${s.reviews_due}</div><div class="l">reviews due (${s.reviews_waiting} in cycle)</div></div>
  </div></div>` : ""}

      <div class="bar-acc"><i style="width:${x.pct}%;background:${usageColor(x.pct)}"></i></div><span class="muted">${resetText(x.reset)}</span></div>`).join("")}</div>

      refreshed every 10 min while you study. Automatic questions pause above ${pauseText(s.settings)} (change it under Preferences below); your own requests still run.</p>`;
  })()}</div>` : ""}
  ${P ? `<div class="card"><h2>By section</h2><table>
    <tr><th>Section</th><th>Last 7 days</th><th>All time</th><th class="num">New</th></tr>
    ${Object.entries(CATS).map(([k, v]) => { const c = s.categories[k]; return `<tr><td>${v}</td>

      <td class="num">${c.unseen}${c.generating ? `<div class="muted">+${c.generating}</div>` : ""}</td></tr>`; }).join("")}
  </table><p class="muted">"Correct" counts only answers not marked 🤔 unsure.</p></div>
  <div class="card"><h2>About you</h2>
    <p class="muted" style="margin-top:0">Claude reads this with every batch and adapts the questions to it: your background, strong and

    <form class="gen" id="profileForm" autocomplete="off">
      <textarea name="text" maxlength="4000" autocomplete="off" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other" placeholder="${esc(PROFILE_HINT)}">${esc(st.profile.draft ?? st.profile.text ?? "")}</textarea>
      <div style="display:flex;gap:10px;align-items:center"><button class="next" style="margin:0;flex:0 0 auto;padding-inline:22px">Save</button>
        <span class="muted" id="profileState">${st.profile.draft !== null && st.profile.draft !== st.profile.text ? "Unsaved changes" : ""}</span></div>

      <label>Section<select name="category"><option value="mix">All sections</option>

      ${s.recent_jobs.map(j => `<tr><td>${jobLabel(j)}${j.error ? `<div class="muted">${esc(j.error.slice(0, 120))}</div>` : ""}</td>
        <td class="muted">${j.status}</td><td class="num">${j.made}/${j.count}</td></tr>`).join("")}</table></details>` : ""}
  </div>` : ""}

      <td class="muted">${x.correct ? "unsure" : "wrong"}</td></tr>`).join("")}</table>` : '<p class="muted">None yet.</p>'}
    ${s.flagged ? `<p class="muted">${s.flagged} question(s) reported as broken.</p>` : ""}
  </div>` : ""}
  ${S ? `${settingsCard()}
  <p class="muted" style="text-align:center">Questions written by Claude. Voices: VOICEVOX:No.7, 青山龍星, 玄野武宏, 剣崎雌雄,
    冥鳴ひまり, もち子さん, 雨晴はう. Icon: Yuji Syuku font (SIL OFL).</p>` : ""}`;
  if (S) { bindSettings(); bindGenerate(s); }
  if (P) bindProfile();
}

function bindProfile() {
  const pf = $("#profileForm"), box = pf.elements.namedItem("text");
  box.oninput = () => { st.profile.draft = box.value;
    $("#profileState").textContent = box.value !== st.profile.text ? "Unsaved changes" : ""; };
  pf.onsubmit = async e => {
    e.preventDefault();
    const r = await api("/api/profile", {text: box.value});
    if (r.error) return toast(r.error);
    st.profile = {text: box.value.trim(), draft: null};
    $("#profileState").textContent = "";
    toast("Saved. The next batch of questions will use it.");
  };
}

function bindGenerate(s) {
  const form = $("#genForm"), field = n => form.elements.namedItem(n);
  field("level").onchange = () => { st.gen.level = field("level").value === s.level ? null : field("level").value; };
  field("category").onchange = () => { st.gen.category = field("category").value; };
  field("focus").oninput = () => { st.gen.focus = field("focus").value; };
  document.querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
    st.gen.count = +b.dataset.n; document.querySelectorAll("[data-n]").forEach(x => x.classList.toggle("on", x === b)); });
  form.onsubmit = async e => {
    e.preventDefault();
    const lv = st.gen.level || s.level;
    const r = await api("/api/generate", {level: lv, category: st.gen.category, count: st.gen.count, focus: st.gen.focus});
    if (r.error) return toast(r.error);
    st.gen.focus = "";
    toast(lv === s.level ? "Queued. New questions appear as soon as each batch is ready."
                         : `Queued ${lv} questions. You'll find them when you switch to ${lv}.`);
    renderStats();
  };
}

setInterval(() => { if (st.tab === "study" && !document.hidden) refreshStats(); }, 60000);
setInterval(() => { if (st.tab !== "study" && !document.hidden && !document.activeElement.matches("input,select,textarea")) renderStats(); }, 10000);
applyFuri();
renderModes();
loadNext();
</script>
</body>
</html>
